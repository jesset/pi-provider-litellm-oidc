# CI: build, typecheck, unit tests, documentation links and publish-artifact
# invariants on main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # --ignore-scripts: no install-time lifecycle scripts (prepare included);
      # the build always runs explicitly below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Syntax smoke check
        run: node --check dist/index.js

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: bun test

      - name: Documentation links
        run: npm run docs:check

      - name: Publish-artifact invariants
        run: npm run supply-chain:guard
